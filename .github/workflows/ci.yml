name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Fork protection - don't run on forks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    if: github.repository == 'holtwood-projects/webgpu-sorting'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier check
        run: npm run format:check

      - name: Run TypeScript type check
        run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint
    if: github.repository == 'holtwood-projects/webgpu-sorting'
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '20.x'
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Upload coverage to Codecov
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # GPU kernel 的真实行为只在浏览器里可验证（SwiftShader 提供 WebGPU）。
  # 没有这个 job 时，kernel 回归无法被任何 CI 检查捕获。
  e2e:
    name: Browser E2E (WebGPU)
    runs-on: ubuntu-latest
    needs: lint
    if: github.repository == 'holtwood-projects/webgpu-sorting'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (with system deps)
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: npm run test:browser

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.repository == 'holtwood-projects/webgpu-sorting'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Validate output
        run: |
          test -f docs/.vitepress/dist/index.html || { echo "Missing index.html"; exit 1; }
          test -f docs/.vitepress/dist/demo.html || { echo "Missing demo.html"; exit 1; }
          test -f docs/.vitepress/dist/playground/index.html || { echo "Missing playground/index.html"; exit 1; }
          echo "✓ All critical files present"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: docs/.vitepress/dist
          retention-days: 7
